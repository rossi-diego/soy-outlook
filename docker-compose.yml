# Full stack with one command:  docker compose up   ->  http://localhost:3000
#   1. pipeline: downloads the WASDE history, CBOT closes and PTAX, runs the backtest
#      (about a minute) and writes web/public/data
#   2. web: builds the static Next.js site from that data and serves it
services:
  pipeline:
    build: .
    volumes:
      - ./data:/app/data
      - ./web/public/data:/app/web/public/data
    env_file:
      - path: .env
        required: false

  web:
    image: node:22-alpine
    working_dir: /web
    command: ["sh", "-c", "npm ci && npm run build && npx --yes serve@14 out -l 3000"]
    ports:
      - "3000:3000"
    volumes:
      - ./web:/web
      - /web/node_modules
    depends_on:
      pipeline:
        condition: service_completed_successfully
