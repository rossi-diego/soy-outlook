name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 19 * * 1-5" # weekdays after the CBOT close: refresh and rebuild

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check src tests
      - run: ruff check src tests
      - run: mypy src
      - run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  pipeline:
    needs: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Run the pipeline on live data
        run: soyforecast --json-logs run
        env:
          SOY_DATA_DIR: ${{ github.workspace }}/data
          SOY_WEB_DATA_DIR: ${{ github.workspace }}/web/public/data
      - uses: actions/upload-artifact@v4
        with:
          name: site-data
          path: web/public/data

  web:
    needs: pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site-data
          path: web/public/data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "true"
