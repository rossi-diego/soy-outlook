[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soyforecast"
version = "2.0.0"
description = "Honest, point-in-time forecasts of the CBOT soybean price and Paranaguá FOB after each USDA WASDE report."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Diego Rossi" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "statsmodels>=0.14.2",
    "structlog>=24.1",
    "typer>=0.12",
    # Upper bound: Yahoo's response format is not a stable API; a major release is reviewed first.
    "yfinance>=0.2.54,<2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
soyforecast = "soyforecast.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/soyforecast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --tb=short"
markers = ["network: hits real endpoints (deselected in CI)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "N803", "N806", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.coverage.run]
source = ["soyforecast"]
omit = []

[tool.coverage.report]
show_missing = true
